name: Windows desktop development package
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: BookCreator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Fugu0141/BookCreator_Markdown
          ref: 0a096d3e0b3c294b7f9e17054a40ab8a844c2a52
          path: BookCreator_Markdown
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Fugu0141/BookCreator_LayoutEngine
          ref: cb19394c600538f65144dd2f24af83a62d117e88
          path: BookCreator_LayoutEngine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
      - name: Build pinned libraries and app core
        run: |
          foreach ($dir in @('BookCreator_Markdown','BookCreator_LayoutEngine','BookCreator')) {
            Push-Location $dir
            try {
              npm install --ignore-scripts --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
              npm run build
              if ($LASTEXITCODE -ne 0) { throw 'build failed' }
            } finally { Pop-Location }
          }
      - name: Build desktop and stage portable package
        working-directory: BookCreator/apps/desktop
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'desktop install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'desktop build failed' }
          node package-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'package failed' }
      - name: Run packaged executable in an isolated temp workspace
        working-directory: BookCreator
        run: |
          $package = (Resolve-Path 'dist-windows/BookCreator').Path
          $isolated = Join-Path $env:RUNNER_TEMP 'BookCreator portable 日本語'
          if (Test-Path $isolated) { throw 'Unexpected existing test directory' }
          Move-Item -LiteralPath $package -Destination $isolated
          try {
            $stdout = Join-Path $env:RUNNER_TEMP 'bc-package-stdout.txt'
            $stderr = Join-Path $env:RUNNER_TEMP 'bc-package-stderr.txt'
            $process = Start-Process -FilePath (Join-Path $isolated 'BookCreator.exe') -ArgumentList '--package-smoke' -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if (-not $process.WaitForExit(180000)) {
              taskkill /PID $process.Id /T /F
              throw 'Packaged app timeout'
            }
            Get-Content $stdout,$stderr -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0) { throw "Packaged app failed: $($process.ExitCode)" }
            if (-not (Select-String -Path $stdout -Pattern 'PASS portable Windows package' -Quiet)) { throw 'Missing packaged smoke completion marker' }
          } finally {
            Move-Item -LiteralPath $isolated -Destination $package
          }
      - name: Upload tested Windows x64 portable package
        uses: actions/upload-artifact@v4
        with:
          name: BookCreator-Windows-x64-preview
          path: BookCreator/dist-windows/BookCreator/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
