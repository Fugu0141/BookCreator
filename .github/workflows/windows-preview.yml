name: Windows desktop development package
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: BookCreator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Fugu0141/BookCreator_Markdown
          ref: 9121a91da770b30782d7a9ca07b073143ea6ffab
          path: BookCreator_Markdown
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Fugu0141/BookCreator_LayoutEngine
          ref: 78fd60408270b8edb04d57d94a67607060165558
          path: BookCreator_LayoutEngine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: x64
      - name: Build pinned libraries and app core
        run: |
          foreach ($dir in @('BookCreator_Markdown','BookCreator_LayoutEngine','BookCreator')) {
            Push-Location $dir
            try {
              npm install --ignore-scripts --no-audit --no-fund
              if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
              npm run build
              if ($LASTEXITCODE -ne 0) { throw 'build failed' }
            } finally { Pop-Location }
          }
      - name: Build desktop and stage portable package
        working-directory: BookCreator/apps/desktop
        run: |
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'desktop install failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'desktop build failed' }
          node package-windows.mjs
          if ($LASTEXITCODE -ne 0) { throw 'package failed' }
      - name: Run packaged executable in an isolated temp workspace
        working-directory: BookCreator
        run: |
          $package = (Resolve-Path 'dist-windows/BookCreator').Path
          $isolated = Join-Path $env:RUNNER_TEMP 'BookCreator portable 日本語'
          if (Test-Path $isolated) { throw 'Unexpected existing test directory' }
          Move-Item -LiteralPath $package -Destination $isolated
          $smokeParent = Join-Path $env:RUNNER_TEMP ('bc-package-profile-' + [Guid]::NewGuid().ToString('N'))
          try {
            New-Item -ItemType Directory -Path $smokeParent -ErrorAction Stop | Out-Null
            $env:BC_PACKAGE_SMOKE_TMP = $smokeParent
            $stdout = Join-Path $env:RUNNER_TEMP 'bc-package-stdout.txt'
            $stderr = Join-Path $env:RUNNER_TEMP 'bc-package-stderr.txt'
            $env:BC_PACKAGE_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'bc-package-smoke-report.txt'
            $process = Start-Process -FilePath (Join-Path $isolated 'BookCreator.exe') -ArgumentList '--package-smoke' -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if (-not $process.WaitForExit(180000)) {
              taskkill /PID $process.Id /T /F
              throw 'Packaged app timeout'
            }
            Get-Content $stdout,$stderr -ErrorAction SilentlyContinue
            if ($process.ExitCode -ne 0) { throw "Packaged app failed: $($process.ExitCode)" }
            if (-not (Test-Path $env:BC_PACKAGE_SMOKE_REPORT) -or -not (Select-String -Path $env:BC_PACKAGE_SMOKE_REPORT -Pattern 'PASS portable Windows package' -Quiet)) { throw 'Missing packaged smoke completion marker' }
            Get-Content $env:BC_PACKAGE_SMOKE_REPORT
            # Launch a separate executable only after the original process exited.
            # Reuse precisely the profile that completed the first journey.
            $profiles = @(Get-ChildItem -LiteralPath $smokeParent -Directory -Filter 'bc-electron-*')
            if ($profiles.Count -ne 1) { throw 'Expected exactly one first-phase smoke profile' }
            $env:BC_PACKAGE_RESTART_ROOT = $profiles[0].FullName
            $restartOut = Join-Path $env:RUNNER_TEMP 'bc-package-restart-stdout.txt'
            $restartErr = Join-Path $env:RUNNER_TEMP 'bc-package-restart-stderr.txt'
            $env:BC_PACKAGE_SMOKE_REPORT = Join-Path $env:RUNNER_TEMP 'bc-package-restart-report.txt'
            $restart = Start-Process -FilePath (Join-Path $isolated 'BookCreator.exe') -ArgumentList '--package-restart-smoke' -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $restartOut -RedirectStandardError $restartErr -PassThru
            if (-not $restart.WaitForExit(180000)) {
              taskkill /PID $restart.Id /T /F
              throw 'Packaged restart timeout'
            }
            Get-Content $restartOut,$restartErr -ErrorAction SilentlyContinue
            if ($restart.ExitCode -ne 0) { throw "Packaged restart failed: $($restart.ExitCode)" }
            if (-not (Test-Path $env:BC_PACKAGE_SMOKE_REPORT) -or -not (Select-String -Path $env:BC_PACKAGE_SMOKE_REPORT -Pattern 'PASS UX-10d portable Windows process restart' -Quiet)) { throw 'Missing restart smoke completion marker' }
            Get-Content $env:BC_PACKAGE_SMOKE_REPORT
            # Force-terminate only the isolated test executable launched here.
            # A ready marker is written after the real editor checkpoint and disk checks.
            $env:BC_PACKAGE_SMOKE_REPORT = Join-Path $smokeParent 'crash-ready.txt'
            $crashOut = Join-Path $env:RUNNER_TEMP 'bc-crash-prepare-stdout.txt'
            $crashErr = Join-Path $env:RUNNER_TEMP 'bc-crash-prepare-stderr.txt'
            $crash = Start-Process -FilePath (Join-Path $isolated 'BookCreator.exe') -ArgumentList '--package-crash-prepare' -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $crashOut -RedirectStandardError $crashErr -PassThru
            try {
              $deadline = [DateTime]::UtcNow.AddSeconds(90)
              $ready = $false
              while ([DateTime]::UtcNow -lt $deadline) {
                $crash.Refresh()
                if ($crash.HasExited) { throw "Crash preparation exited before forced termination: $($crash.ExitCode)" }
                if (Test-Path -LiteralPath $env:BC_PACKAGE_SMOKE_REPORT) {
                  $marker = (Get-Content -LiteralPath $env:BC_PACKAGE_SMOKE_REPORT -Raw).Trim()
                  if ($marker -eq "READY UX-10f-3 $($crash.Id)") { $ready = $true; break }
                }
                Start-Sleep -Milliseconds 200
              }
              if (-not $ready) { throw 'Missing crash-ready marker' }
              taskkill /PID $crash.Id /T /F
              if ($LASTEXITCODE -ne 0 -or -not $crash.WaitForExit(15000)) { throw 'Could not force-terminate isolated executable' }
              if ($crash.ExitCode -eq 0) { throw 'Expected abnormal process exit' }
            } finally {
              $crash.Refresh()
              if (-not $crash.HasExited) { taskkill /PID $crash.Id /T /F; $null = $crash.WaitForExit(15000) }
              Get-Content $crashOut,$crashErr -ErrorAction SilentlyContinue
            }
            $env:BC_PACKAGE_SMOKE_REPORT = Join-Path $smokeParent 'crash-verified.txt'
            $verifyOut = Join-Path $env:RUNNER_TEMP 'bc-crash-verify-stdout.txt'
            $verifyErr = Join-Path $env:RUNNER_TEMP 'bc-crash-verify-stderr.txt'
            $verify = Start-Process -FilePath (Join-Path $isolated 'BookCreator.exe') -ArgumentList '--package-crash-verify' -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $verifyOut -RedirectStandardError $verifyErr -PassThru
            if (-not $verify.WaitForExit(180000)) {
              taskkill /PID $verify.Id /T /F
              throw 'Crash recovery verification timeout'
            }
            Get-Content $verifyOut,$verifyErr -ErrorAction SilentlyContinue
            if ($verify.ExitCode -ne 0) { throw "Crash recovery verification failed: $($verify.ExitCode)" }
            if (-not (Test-Path $env:BC_PACKAGE_SMOKE_REPORT) -or -not (Select-String -Path $env:BC_PACKAGE_SMOKE_REPORT -Pattern 'PASS UX-10f-3 forced process recovery' -Quiet)) { throw 'Missing crash recovery completion marker' }
            Get-Content $env:BC_PACKAGE_SMOKE_REPORT
            # Additional pairs use the same isolated test profile, never a
            # user's process. Keep the original manuscript crash test intact.
            foreach ($kind in @('settings','components')) {
              $env:BC_PACKAGE_SMOKE_REPORT = Join-Path $smokeParent "crash-$kind-ready.txt"
              $out = Join-Path $env:RUNNER_TEMP "bc-crash-$kind-prepare-out.txt"
              $err = Join-Path $env:RUNNER_TEMP "bc-crash-$kind-prepare-err.txt"
              $child = Start-Process -FilePath (Join-Path $isolated 'BookCreator.exe') -ArgumentList "--package-crash-$kind-prepare" -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
              try {
                $ready = $false
                $deadline = [DateTime]::UtcNow.AddSeconds(120)
                while ([DateTime]::UtcNow -lt $deadline) {
                  $child.Refresh()
                  if ($child.HasExited) { throw "$kind preparation exited early: $($child.ExitCode)" }
                  if (Test-Path -LiteralPath $env:BC_PACKAGE_SMOKE_REPORT) {
                    $marker = (Get-Content -LiteralPath $env:BC_PACKAGE_SMOKE_REPORT -Raw).Trim()
                    if ($marker -eq "READY UX-10g-6 $kind $($child.Id)") { $ready = $true; break }
                  }
                  Start-Sleep -Milliseconds 200
                }
                if (-not $ready) { throw "Missing $kind ready marker" }
                taskkill /PID $child.Id /T /F
                if ($LASTEXITCODE -ne 0 -or -not $child.WaitForExit(15000)) { throw "Could not force-terminate isolated $kind executable" }
                if ($child.ExitCode -eq 0) { throw "Expected abnormal $kind exit" }
              } finally {
                $child.Refresh()
                if (-not $child.HasExited) { taskkill /PID $child.Id /T /F; $null = $child.WaitForExit(15000) }
                Get-Content $out,$err -ErrorAction SilentlyContinue
              }
              $env:BC_PACKAGE_SMOKE_REPORT = Join-Path $smokeParent "crash-$kind-verified.txt"
              $out = Join-Path $env:RUNNER_TEMP "bc-crash-$kind-verify-out.txt"
              $err = Join-Path $env:RUNNER_TEMP "bc-crash-$kind-verify-err.txt"
              $child = Start-Process -FilePath (Join-Path $isolated 'BookCreator.exe') -ArgumentList "--package-crash-$kind-verify" -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
              try {
                if (-not $child.WaitForExit(180000)) { throw "$kind crash verification timeout" }
                if ($child.ExitCode -ne 0) { throw "$kind crash verification failed: $($child.ExitCode)" }
                if (-not (Test-Path -LiteralPath $env:BC_PACKAGE_SMOKE_REPORT) -or (Get-Content -LiteralPath $env:BC_PACKAGE_SMOKE_REPORT -Raw).Trim() -ne "PASS UX-10g-6 forced process recovery $kind") { throw "Missing $kind completion marker" }
                Get-Content $env:BC_PACKAGE_SMOKE_REPORT
              } finally {
                $child.Refresh()
                if (-not $child.HasExited) { taskkill /PID $child.Id /T /F; $null = $child.WaitForExit(15000) }
                Get-Content $out,$err -ErrorAction SilentlyContinue
              }
            }
          } finally {
            # Clean only the runner-owned profile tree, after Electron process exit.
            try {
              for ($i = 0; $i -lt 30 -and (Test-Path -LiteralPath $smokeParent); $i++) {
                try { Remove-Item -LiteralPath $smokeParent -Recurse -Force -ErrorAction Stop }
                catch { Start-Sleep -Milliseconds 500 }
              }
              if (Test-Path -LiteralPath $smokeParent) { throw 'Test profile cleanup failed after process exit' }
            } finally {
              Remove-Item Env:BC_PACKAGE_SMOKE_TMP,Env:BC_PACKAGE_RESTART_ROOT,Env:BC_PACKAGE_SMOKE_REPORT -ErrorAction SilentlyContinue
              # Electron child shutdown or scanner locks can briefly outlive the
              # main process. Retry only the original directory restoration;
              # never merge into an existing destination or upload an untested copy.
              for ($attempt = 1; $attempt -le 30; $attempt++) {
                if (-not (Test-Path -LiteralPath $isolated -PathType Container) -or (Test-Path -LiteralPath $package)) {
                  throw 'Unexpected package restoration paths'
                }
                try {
                  Move-Item -LiteralPath $isolated -Destination $package -ErrorAction Stop
                  break
                } catch {
                  if ($attempt -eq 30 -or -not (Test-Path -LiteralPath $isolated -PathType Container) -or (Test-Path -LiteralPath $package)) { throw }
                  Write-Warning "Package restoration attempt ${attempt}: $($_.Exception.Message)"
                  Start-Sleep -Milliseconds 500
                }
              }
              if ((Test-Path -LiteralPath $isolated) -or -not (Test-Path -LiteralPath (Join-Path $package 'BookCreator.exe') -PathType Leaf)) {
                throw 'Tested package restoration incomplete'
              }
            }
          }
      - name: Upload tested Windows x64 portable package
        uses: actions/upload-artifact@v4
        with:
          name: BookCreator-Windows-x64-preview
          path: BookCreator/dist-windows/BookCreator/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
