name: Cross-library smoke test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: BookCreator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Fugu0141/BookCreator_Markdown
          ref: 0a096d3e0b3c294b7f9e17054a40ab8a844c2a52
          path: BookCreator_Markdown
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Fugu0141/BookCreator_LayoutEngine
          ref: 3553b4ce5d28ec446923221b4e22ddfb7d83fa8c
          path: BookCreator_LayoutEngine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenType MATH font fixture
        run: sudo apt-get update && sudo apt-get install -y fonts-texgyre-math fonts-noto-cjk poppler-utils
      - run: |
          for dir in BookCreator_Markdown BookCreator_LayoutEngine BookCreator; do
            (cd "$dir" && npm install --ignore-scripts --no-audit --no-fund && npm run build) || exit 1
          done
      - run: node --test tests/integration.mjs
        working-directory: BookCreator

      - run: google-chrome --version && npm run preview:smoke
        working-directory: BookCreator
      - name: Experimental math PDF preflight
        run: npm run test:math-pdf
        working-directory: BookCreator
