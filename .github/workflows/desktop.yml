name: Desktop workspace PoC
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: BookCreator
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Fugu0141/BookCreator_Markdown
          ref: 9121a91da770b30782d7a9ca07b073143ea6ffab
          path: BookCreator_Markdown
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Fugu0141/BookCreator_LayoutEngine
          ref: 78fd60408270b8edb04d57d94a67607060165558
          path: BookCreator_LayoutEngine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenType MATH font fixture
        run: sudo apt-get update && sudo apt-get install -y fonts-texgyre-math
      - run: |
          for dir in BookCreator_Markdown BookCreator_LayoutEngine BookCreator; do
            (cd "$dir" && npm install --ignore-scripts --no-audit --no-fund && npm run build) || exit 1
          done
      - run: npm install --no-audit --no-fund
        working-directory: BookCreator/apps/desktop
      - name: Select a real static font fixture
        run: |
          FONT="$(fc-match -f '%{file}' 'Liberation Sans')"
          test -f "$FONT"
          echo "BC_TEST_FONT=$FONT" >> "$GITHUB_ENV"
          MATH_FONT="$(fc-match -f '%{file}' 'TeX Gyre Termes Math')"
          test -f "$MATH_FONT"
          echo "BC_TEST_MATH_FONT=$MATH_FONT" >> "$GITHUB_ENV"
      - run: npm test && npm run build
        working-directory: BookCreator/apps/desktop
      - name: Prepare Electron Linux sandbox
        run: |
          node_modules/.bin/install-electron
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
        working-directory: BookCreator/apps/desktop
      - run: xvfb-run -a npm run test:desktop
        working-directory: BookCreator/apps/desktop
      - name: Synthetic book performance benchmark
        run: xvfb-run -a npm run benchmark
        working-directory: BookCreator/apps/desktop
